<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function bootstrapOAuthToken() {
      try {
        var url = new URL(window.location.href);
        var token = url.searchParams.get('token');
        var error = url.searchParams.get('error');

        if (!token && window.location.hash.indexOf('?') !== -1) {
          var hashQuery = window.location.hash.split('?')[1];
          var hashParams = new URLSearchParams(hashQuery);
          token = hashParams.get('token');
          if (!error) error = hashParams.get('error');
        }

        if (token) {
          localStorage.setItem('token', token);
          sessionStorage.setItem('token', token);
        }

        if (url.searchParams.has('token') || url.searchParams.has('error')) {
          url.searchParams.delete('token');
          url.searchParams.delete('error');
          window.history.replaceState({}, '', url.pathname + (url.search ? url.search : '') + url.hash);
        }

        window.__FLAVISTA_OAUTH_BOOTSTRAPPED__ = Boolean(token || error);
      } catch (e) {
        // no-op
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Fredericka+the+Great&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">

</head>

</body>

</html>
